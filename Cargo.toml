[workspace]
members = [
    "crates/shum-core",
    "crates/shum-transport-nostr",
    "crates/shum-transport-ble",
    "crates/shum-store",
    "crates/shum-session",
    "crates/shum-web",
    "crates/shum-mobile",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/hiTechTeam/Shum-Core"

[workspace.dependencies]
shum-core = { path = "crates/shum-core" }
shum-transport-nostr = { path = "crates/shum-transport-nostr", default-features = false }
shum-transport-ble = { path = "crates/shum-transport-ble", default-features = false }
shum-store = { path = "crates/shum-store", default-features = false }
shum-session = { path = "crates/shum-session", default-features = false }

# The browser downloads Shum-Core on first open, so its build favours size:
# scripts/build-web.sh builds shum-web with this profile.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
