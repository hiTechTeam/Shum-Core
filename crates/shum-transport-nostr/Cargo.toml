[package]
name = "shum-transport-nostr"
description = "Shum Nostr relay transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Without "native" only the relay messages and push signing remain, as the
# browser uses them; it connects with its own WebSocket.
[features]
default = ["native"]
native = ["dep:futures-util", "dep:getrandom", "dep:reqwest", "dep:tokio", "dep:tokio-tungstenite"]

[dependencies]
shum-core.workspace = true
base64 = "0.22.1"
futures-util = { version = "0.3", features = ["sink"], optional = true }
getrandom = { version = "0.4.3", optional = true }
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "io-util"], optional = true }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"], optional = true }
url = "2"

[[test]]
name = "live_relays"
required-features = ["native"]

[[example]]
name = "send_private"
required-features = ["native"]
