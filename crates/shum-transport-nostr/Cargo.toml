[package]
name = "shum-transport-nostr"
description = "Shum Nostr relay transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shum-core.workspace = true
base64 = "0.22.1"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4.3"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2"
