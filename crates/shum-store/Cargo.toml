[package]
name = "shum-store"
description = "Encrypted SQLite persistence compatible with Shum iOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shum-core.workspace = true
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
aes-gcm = "0.10.3"
fs2 = "0.4.3"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27"
thiserror = "2.0"
zeroize = "1.8"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
