[package]
name = "shum-session"
description = "A running Shum profile for any client: engine, storage, relays, Bluetooth and push"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shum-core.workspace = true
shum-store = { workspace = true, features = ["native"] }
shum-transport-nostr = { workspace = true, features = ["native"] }
shum-transport-ble.workspace = true
anyhow = "1"
base64 = "0.22"
fs2 = "0.4.3"
getrandom = "0.4.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zeroize = "1"
