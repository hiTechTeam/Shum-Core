[package]
name = "shum-cli"
description = "Shum command-line and terminal client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "shum"
path = "src/main.rs"

[dependencies]
shum-core.workspace = true
shum-transport-nostr.workspace = true
shum-transport-ble.workspace = true
shum-store.workspace = true
anyhow = "1"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
getrandom = "0.4.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rqrr = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "process"] }
unicode-width = "0.2"
zeroize = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.30.0"
