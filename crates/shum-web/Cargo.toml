[package]
name = "shum-web"
description = "Shum-Core for the browser: profiles stored as encrypted records in IndexedDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shum-core.workspace = true
shum-store.workspace = true
shum-transport-nostr.workspace = true
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.129"

# The browser's crypto.getRandomValues is the random source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
