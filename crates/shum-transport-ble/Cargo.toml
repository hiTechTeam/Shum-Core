[package]
name = "shum-transport-ble"
description = "Shum Bluetooth transport for macOS, Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shum-core.workspace = true
anyhow = "1"
base64 = "0.22"
btleplug = "0.13.4"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
uuid = "1"
tempfile = "3"
